services:
  workbook-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: workbook_api
    restart: unless-stopped
    env_file: .env
    volumes:
      - workbook_data:/data
    ports:
      - "${WORKBOOK_BIND_ADDRESS:-0.0.0.0}:${WORKBOOK_BIND_PORT:-8081}:8080"

volumes:
  workbook_data:
