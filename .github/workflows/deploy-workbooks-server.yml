name: Deploy workbooks server

on:
  push:
    branches: [main, feature/editable-upo-editions-20261026]
    paths:
      - 'v4/**'
      - 'courses.js'
      - '.github/workflows/deploy-workbooks-server.yml'
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: workbooks-server-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: 194.48.140.70
          SERVER_PORT: "22"
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Full verified production recovery point
        run: |
          scp server/backup_bundle.py root@194.48.140.70:/tmp/ifcm-release-backup.py
          ssh root@194.48.140.70 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          point="/opt/upo-workbooks/backups/before-editable-release-$stamp"
          install -d -m 700 "$point"
          docker cp /tmp/ifcm-release-backup.py workbook_api:/tmp/ifcm-release-backup.py
          docker exec workbook_api python /tmp/ifcm-release-backup.py --data-dir /data --output /tmp/ifcm-release-data.tgz --source-dir /app
          docker cp workbook_api:/tmp/ifcm-release-data.tgz "$point/data.tgz"
          docker inspect workbook_api > "$point/container-settings.json"
          tar --exclude=backups --exclude=__pycache__ -czf "$point/source-and-settings.tgz" -C /opt/upo-workbooks .
          tar -tzf "$point/source-and-settings.tgz" >/dev/null
          (cd "$point" && sha256sum data.tgz source-and-settings.tgz container-settings.json > SHA256SUMS && sha256sum -c SHA256SUMS)
          python3 - "$point" <<'PY'
          import sys,tarfile
          from pathlib import Path
          p=Path(sys.argv[1])
          with tarfile.open(p/'data.tgz') as t:(p/'legacy.sqlite3').write_bytes(t.extractfile('data/workbooks.sqlite3').read())
          PY
          chmod 600 "$point"/*
          printf '%s' "$point" > /opt/upo-workbooks/backups/latest-editable-release
          docker exec workbook_api rm -f /tmp/ifcm-release-backup.py /tmp/ifcm-release-data.tgz
          echo 'Full recovery archive verified before production changes'
          REMOTE

      - name: Package application
        run: tar --exclude=server/fire-access.enc -czf /tmp/upo-workbooks.tgz .dockerignore server v2 v3 v4 builder assets courses.js

      - name: Upload application
        env:
          SERVER_HOST: 194.48.140.70
          SERVER_PORT: "22"
          SERVER_USER: root
        run: scp -P "${SERVER_PORT:-22}" /tmp/upo-workbooks.tgz "$SERVER_USER@$SERVER_HOST:/tmp/upo-workbooks.tgz"

      - name: Deploy separate container
        env:
          SERVER_HOST: 194.48.140.70
          SERVER_PORT: "22"
          SERVER_USER: root
          WORKBOOK_ACCESS_CODE: ${{ secrets.WORKBOOK_ACCESS_CODE }}
          WORKBOOK_ADMIN_LOGIN: ${{ secrets.WORKBOOK_ADMIN_LOGIN }}
          WORKBOOK_ADMIN_PASSWORD: ${{ secrets.WORKBOOK_ADMIN_PASSWORD }}
        run: |
          ACCESS_B64="$(printf '%s' "$WORKBOOK_ACCESS_CODE" | base64 -w0)"
          ADMIN_LOGIN_B64="$(printf '%s' "$WORKBOOK_ADMIN_LOGIN" | base64 -w0)"
          ADMIN_PASSWORD_B64="$(printf '%s' "$WORKBOOK_ADMIN_PASSWORD" | base64 -w0)"
          ssh -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "ACCESS_B64='$ACCESS_B64' ADMIN_LOGIN_B64='$ADMIN_LOGIN_B64' ADMIN_PASSWORD_B64='$ADMIN_PASSWORD_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          install -d -m 700 /opt/upo-workbooks
          install -d -m 700 /opt/upo-workbooks/backups
          if [ -f /opt/upo-workbooks/server/app.py ]; then
            cd /opt/upo-workbooks
            tar --exclude='server/.env' --exclude='__pycache__' -czf "backups/source-$(date -u +%Y%m%dT%H%M%SZ).tgz" server v3 assets courses.js
            if [ -d v4 ]; then tar -czf "backups/v4-$(date -u +%Y%m%dT%H%M%SZ).tgz" v4; fi
            if [ -d builder ]; then tar -czf "backups/builder-$(date -u +%Y%m%dT%H%M%SZ).tgz" builder; fi
          fi
          if docker ps --format '{{.Names}}' | grep -qx workbook_api; then
            docker exec workbook_api python -c 'import sqlite3, pathlib, datetime; p=pathlib.Path("/data/backups"); p.mkdir(exist_ok=True); src=sqlite3.connect("/data/workbooks.sqlite3"); dst=sqlite3.connect(p/("before-update-"+datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")+".sqlite3")); src.backup(dst); dst.close(); src.close()'
          fi
          tar -xzf /tmp/upo-workbooks.tgz -C /opt/upo-workbooks
          cd /opt/upo-workbooks/server
          CODE="$(printf '%s' "$ACCESS_B64" | base64 -d)"
          ADMIN_LOGIN="$(printf '%s' "$ADMIN_LOGIN_B64" | base64 -d)"
          ADMIN_PASSWORD="$(printf '%s' "$ADMIN_PASSWORD_B64" | base64 -d)"
          if [ ! -f .env ]; then
            umask 077
            TOKEN_SECRET="$(openssl rand -hex 32)"
            ADMIN_KEY="$(openssl rand -hex 32)"
            printf 'WORKBOOK_TOKEN_SECRET=%s\nWORKBOOK_ADMIN_KEY=%s\n' "$TOKEN_SECRET" "$ADMIN_KEY" > .env
          fi
          sed -i '/^WORKBOOK_ACCESS_CODE=/d;/^WORKBOOK_ADMIN_LOGIN=/d;/^WORKBOOK_ADMIN_PASSWORD=/d;/^WORKBOOK_ALLOWED_ORIGINS=/d;/^WORKBOOK_DB_PATH=/d;/^WORKBOOK_TOKEN_TTL_HOURS=/d;/^WORKBOOK_ADMIN_TOKEN_TTL_HOURS=/d' .env
          printf 'WORKBOOK_ACCESS_CODE=%s\nWORKBOOK_ADMIN_LOGIN=%s\nWORKBOOK_ADMIN_PASSWORD=%s\nWORKBOOK_ALLOWED_ORIGINS=http://194.48.140.70:8081\nWORKBOOK_DB_PATH=/data/workbooks.sqlite3\nWORKBOOK_TOKEN_TTL_HOURS=168\nWORKBOOK_ADMIN_TOKEN_TTL_HOURS=12\n' "$CODE" "$ADMIN_LOGIN" "$ADMIN_PASSWORD" >> .env
          if [ -f /opt/upo-workbooks/https/origin ]; then
            HTTPS_ORIGIN=$(cat /opt/upo-workbooks/https/origin)
            test "$HTTPS_ORIGIN" = 'https://194.48.140.70'
            sed -i '/^WORKBOOK_ALLOWED_ORIGINS=/d' .env
            printf 'WORKBOOK_ALLOWED_ORIGINS=%s\n' "$HTTPS_ORIGIN" >> .env
          fi
          docker compose -p upo_workbooks up -d --build --remove-orphans
          for attempt in $(seq 1 30); do
            if docker exec workbook_api python -c 'import json,urllib.request; r=urllib.request.build_opener(urllib.request.ProxyHandler({})).open("http://127.0.0.1:8080/health",timeout=2); assert json.load(r).get("status")=="ok"' 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -p upo_workbooks logs --tail=100
              exit 1
            fi
            sleep 2
          done
          docker exec workbook_api python /app/verify_accounts.py
          point=$(cat /opt/upo-workbooks/backups/latest-editable-release)
          docker cp "$point/legacy.sqlite3" workbook_api:/tmp/ifcm-legacy.sqlite3
          docker exec workbook_api python /app/verify_legacy.py /tmp/ifcm-legacy.sqlite3 /data/workbooks.sqlite3
          docker exec workbook_api python -c 'import os; import release_bootstrap; release_bootstrap.publish() if os.environ.get("WORKBOOK_PERSONAL_ACCOUNTS","1") != "1" else print("Existing publications preserved; no implicit course publication")'
          docker exec workbook_api python /app/verify_legacy.py /tmp/ifcm-legacy.sqlite3 /data/workbooks.sqlite3
          docker exec workbook_api python /app/material_links.py --apply
          docker exec workbook_api python /app/accounting_wording.py --apply
          docker exec workbook_api python -c 'import app; d=app.admin_dashboard({"account":{"roles":["admin"]}}); groups=[c["group_id"] for c in d["courses"]]; assert len(groups)==len(set(groups)); assert all(" · версия " not in c["course_title"] for c in d["courses"]); print("Dashboard workbook families verified:", len(groups))'
          docker exec workbook_api rm -f /tmp/ifcm-legacy.sqlite3
          rm -f /tmp/upo-workbooks.tgz
          REMOTE

      - name: Verify public endpoint
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 https://194.48.140.70/health
          curl --fail --silent --show-error --retry 3 'https://194.48.140.70/v4/admin.html?release=20261029-families' | python -c 'import sys; assert "admin.js?release=20261029-families" in sys.stdin.read()'
          curl --fail --silent --show-error --retry 3 'https://194.48.140.70/v4/admin.js?release=20261029-families' | python -c 'import sys; s=sys.stdin.read(); assert "Направления обучения" in s and "courseBars(view.courses)" in s'
          for path in v3/index.html v3/sklad-1c-upo.html v3/rabotniki-sklada.html v3/admin.html builder/index.html builder/workbook.html builder/review.html builder/editor.js builder/render.js api/v1/workbooks v4/index.html v4/sklad-1c-upo.html v4/rabotniki-sklada.html v4/admin.html v4/admin.js v4/brand.css v4/admin-nav.js v4/admin-nav.css v4/builder/index.html v4/builder/workbook.html v4/builder/review.html v4/builder/editor.js v4/brand/ornament-color.webp v4/brand/ornament-outline.webp v4/fire/index.html v4/fire/teacher.html v4/fire/fire.js v4/fire/fire.css v4/fire/data.json api/v1/fire/settings v4/builder/fire.html v4/fire/editable.html v4/fire/catalog.js api/v1/fire/builder/catalog; do
            curl --fail --silent --show-error --retry 3 --output /dev/null "http://194.48.140.70:8081/$path"
          done

  review:
    if: github.ref == 'refs/heads/feature/editable-upo-editions-20261026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 194.48.140.70 >> ~/.ssh/known_hosts
      - name: Package review source
        run: tar -czf /tmp/upo-review.tgz server v2 v3 v4 builder assets courses.js tools
      - name: Back up production and deploy isolated review
        run: |
          scp /tmp/upo-review.tgz root@194.48.140.70:/tmp/upo-review.tgz
          ssh root@194.48.140.70 'install -d -m 700 /tmp/upo-review-source && tar -xzf /tmp/upo-review.tgz -C /tmp/upo-review-source && bash /tmp/upo-review-source/tools/review-stage.sh'
